<feOffset in="soft" dy="2" result="offset"/>
<feFlood flood-color="#000000" flood-opacity=".25"/>
<feComposite in2="offset" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

